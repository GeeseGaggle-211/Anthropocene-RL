name: neolithic-elder-v1
simulator_manifest: configs/simulator/elder-v2.yaml
partition_key: [world_seed, trajectory_family]
partitions:
  - train
  - development
  - heldout
stages:
  - id: 0
    name: adapter-and-optimizer-smoke
    movement: false
    outcome_claim: none
  - id: 1
    name: retention-and-development
    movement: false
  - id: 2
    name: technology-regime-adaptation
    movement: false
    counterfactual_q_k: [0.4, 0.5, 0.8]
  - id: 3
    name: permanence-and-mobility
    movement: true
  - id: 4
    name: mixed-subsistence-and-external-flows
    systems: [fishing, trade, immigration, taming, fission]
  - id: 5
    name: long-horizon-generalization
    extended_continuation: true
minimum_training_seeds_for_claim: 3
snapshot_strata:
  - settlement_permanence
  - retained_field_capital
  - herd_pressure_relative_to_support
  - aquatic_opportunity
  - realized_food_receipt_mix
  - service_security
  - reserves
  - labor_scale
  - material_and_tool_constraints
  - contact_and_trade_exposure
  - movement_opportunity
  - fission_exit_opportunity
  - recent_fission_parent
  - institutional_memory_maturity
  - technology_frontier_transition
development_regressions:
  - option-a-a-through-i-development-only
  - existing-issue-41-fishing-first-diagnostics
  - disclosed-investment-payback-technology-stress
heldout_challenges:
  - fresh-matched-fishing-first
  - fresh-fission-reward-adversarial
  - unseen-frontier-magnitude-or-unlock-timing

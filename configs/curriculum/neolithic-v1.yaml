  - retained_field_capital
  - herd_pressure_relative_to_support
  - aquatic_opportunity
  - realized_food_receipt_mix
  - service_security
  - reserves
  - labor_scale
  - material_and_tool_constraints
  - contact_and_trade_exposure
  - movement_opportunity
  - fission_exit_opportunity
  - recent_fission_parent
challenge_cases:
  - issue-41-fishing-first-or-fresh-matched-equivalent
  - option-a-a-through-i-development-only
  - fission-reward-adversarial

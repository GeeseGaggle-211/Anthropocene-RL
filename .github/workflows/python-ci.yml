name: Python Elder v2 checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_gate1_freeze_candidate reads pinned historical sources with git show.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --extra dev --extra adapter --extra training
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run anthropocene-rl check-manifest
      - run: uv run anthropocene-rl ppo-smoke

  # Cross-private-repository simulator/bridge checks require a credential that
  # can read GeeseGaggle-211/Anthropocene. The local bootstrap/check commands
  # enforce the exact SHA until that GitHub Actions credential path is selected.

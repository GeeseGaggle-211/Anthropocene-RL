name: Python skeleton checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run anthropocene-rl check-manifest

  # Cross-private-repository simulator checks require a read token or GitHub App
  # installation that can access GeeseGaggle-211/Anthropocene. Add that job only
  # after the credential path is selected; do not embed a personal token here.

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anthropocene-rl"
version = "0.2.0"
description = "Training and evaluation harness for Anthropocene learned agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Suyash Bhatt" }]
dependencies = [
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
adapter = [
  "gymnasium==1.2.2",
]
training = [
  "torch==2.14.1",
  "tensorboard>=2.19,<3",
]
baseline = [
  "stable-baselines3==2.9.0",
]
distributed = [
  "ray[rllib]==2.59.0",
  "pettingzoo==1.26.1",
]
export = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.1,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
anthropocene-rl = "anthropocene_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropocene_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["anthropocene_rl"]
